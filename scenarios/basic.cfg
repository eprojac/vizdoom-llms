# Simple default 1v1 arena for Doom VLM Duel.
#
# The map geometry and item placement live in basic_1v1.wad:
# - Qwen/Gemma spawn on opposite sides of a rectangular room.
# - A medikit is in the middle.
# - A shotgun and shells sit near one middle wall.
# - Green armor sits near the opposite middle wall.

doom_scenario_path = basic_1v1.wad
doom_map = map01
doom_skill = 5

screen_resolution = RES_320X240
render_hud = true
render_crosshair = true
render_weapon = true
render_decals = true
render_particles = true
render_corpses = false

episode_start_time = 14
episode_timeout = 25200

available_buttons =
    {
        MOVE_FORWARD
        MOVE_BACKWARD
        TURN_LEFT
        TURN_RIGHT
        MOVE_LEFT
        MOVE_RIGHT
        ATTACK
        USE
    }

mode = ASYNC_PLAYER
